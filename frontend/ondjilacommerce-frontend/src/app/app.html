<router-outlet></router-outlet>

<!-- Global Toast Notification -->
<div *ngIf="cartService.toastMessage$ | async as message"
     class="fixed top-24 right-8 bg-[#C8960C] text-white px-6 py-4 rounded-lg shadow-[0_4px_20px_rgba(200,150,12,0.3)] z-[9999] flex items-center gap-3 font-['Inter'] transition-all duration-500 ease-out transform translate-y-0 opacity-100">
  <span class="material-symbols-outlined" translate="no">check_circle</span>
  <span class="text-sm font-medium">{{ message }}</span>
</div>

<!-- AI Support Floating Button (2026 Standard) -->
<div class="fixed bottom-8 right-8 z-[9000]">
  <!-- Chat Window -->
  <div *ngIf="isChatOpen()" class="absolute bottom-20 right-0 w-[350px] h-[500px] bg-white rounded-2xl shadow-2xl border border-outline-variant flex flex-col overflow-hidden animate-in slide-in-from-bottom-4 duration-300">
    <div class="bg-primary-container p-4 text-white flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined" translate="no">smart_toy</span>
        <span class="font-bold text-sm tracking-widest">ONDJILA IA</span>
      </div>
      <button (click)="toggleChat()" class="hover:bg-white/20 rounded-full p-1">
        <span class="material-symbols-outlined" translate="no">close</span>
      </button>
    </div>
    <div class="flex-grow p-4 overflow-y-auto space-y-4 bg-[#F9F8F6]">
      <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm text-sm border border-outline-variant max-w-[85%]">
        Olá! Sou o assistente da **ONDJILA**. Como posso ajudar na sua jornada de tecnologia hoje? 🇦🇴
      </div>
    </div>
    <div class="p-4 border-t border-outline-variant bg-white">
      <div class="flex gap-2">
        <input type="text" placeholder="Escreva a sua mensagem..." class="flex-grow bg-[#F5F2EC] rounded-full px-4 py-2 text-sm outline-none focus:ring-1 ring-primary-container"/>
        <button class="bg-primary-container text-white rounded-full w-9 h-9 flex items-center justify-center">
          <span class="material-symbols-outlined text-sm" translate="no">send</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toggle Button -->
  <button (click)="toggleChat()" class="w-14 h-14 bg-primary-container text-white rounded-full shadow-gold hover:scale-110 transition-all flex items-center justify-center relative group">
    <span class="material-symbols-outlined text-[28px]" translate="no">{{ isChatOpen() ? 'close' : 'smart_toy' }}</span>
    <div *ngIf="!isChatOpen()" class="absolute right-full mr-4 bg-white text-on-surface text-[10px] font-bold py-2 px-4 rounded-lg shadow-md whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity uppercase tracking-widest border border-outline-variant">
      Assistente ONDJILA IA
    </div>
    <span *ngIf="!isChatOpen()" class="absolute top-0 right-0 w-3 h-3 bg-error rounded-full border-2 border-white"></span>
  </button>
</div>

<div class="min-h-screen bg-[#F5F2EC] flex flex-col font-['Inter']">
  <header class="w-full bg-white h-[80px] flex items-center justify-between px-8 border-b border-[#E8E4DC]">
    <div class="font-light text-2xl tracking-widest text-[#C8960C] uppercase">Ondjila Gold</div>
    <nav class="hidden md:flex gap-md font-body-main text-body-main">
<a class="text-on-surface-variant hover:text-primary-container transition-colors duration-200" routerLink="/">Início</a>
<a class="text-on-surface-variant hover:text-primary-container transition-colors duration-200" routerLink="/categories">Categorias</a>
<a class="text-on-surface-variant hover:text-primary-container transition-colors duration-200" routerLink="/about">Sobre Nós</a>
<a class="text-on-surface-variant hover:text-primary-container transition-colors duration-200" routerLink="/contact">Contactos</a>
</nav>
    <div class="flex items-center gap-4">
      <a routerLink="/customer-account" class="material-symbols-outlined text-[#201b12] hover:text-[#C8960C]">person</a>
      <a routerLink="/cart" class="material-symbols-outlined text-[#C8960C]">shopping_cart</a>
    </div>

  <main class="flex-grow max-w-5xl mx-auto w-full px-8 py-16">
    <h2 class="text-3xl font-light text-[#201b12] mb-8">O Meu Carrinho</h2>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
      <!-- Cart Items -->
      <div class="lg:col-span-2 space-y-6">
        <div class="bg-white p-6 rounded-lg shadow-[0_2px_12px_rgba(200,150,12,0.06)] border border-[#E8E4DC] flex gap-6 items-center">
          <div class="w-24 h-24 bg-[#F5F2EC] rounded flex items-center justify-center">
            <span class="material-symbols-outlined text-[#C8960C] text-4xl" translate="no">headphones</span>
          </div>
          <div class="flex-grow">
            <h4 class="text-lg text-[#201b12]">Auscultadores Ondjila Pro</h4>
            <p class="text-sm text-[#4f4634]">Edição Gold</p>
          </div>
          <div class="flex flex-col items-end">
            <p class="text-[#C8960C] text-lg font-medium mb-2">61.500 Kz</p>
            <div class="flex items-center gap-3 border border-[#E8E4DC] rounded px-3 py-1">
              <button class="text-[#4f4634] hover:text-[#C8960C]">-</button>
              <span class="text-sm">1</span>
              <button class="text-[#4f4634] hover:text-[#C8960C]">+</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="bg-white p-8 rounded-lg shadow-[0_2px_12px_rgba(200,150,12,0.06)] border border-[#E8E4DC] h-fit">
        <h3 class="text-sm uppercase tracking-widest text-[#201b12] mb-6">Resumo da Encomenda</h3>
        
        <div class="space-y-4 text-sm text-[#4f4634] mb-6 border-b border-[#E8E4DC] pb-6">
          <div class="flex justify-between">
            <span>Subtotal</span>
            <span>61.500 Kz</span>
          </div>
          <div class="flex justify-between">
            <span>Envio (Angola)</span>
            <span>Grátis</span>
          </div>
        </div>
        
        <div class="flex justify-between text-lg text-[#201b12] font-medium mb-8">
          <span>Total</span>
          <span class="text-[#C8960C]">61.500 Kz</span>
        </div>

        <button routerLink="/checkout" class="w-full bg-[#C8960C] text-white py-4 text-xs uppercase tracking-widest hover:bg-[#A87A09] transition-colors">
          FINALIZAR COMPRA
        </button>
      </div>

  <footer class="bg-[#201b12] text-white py-16 px-8 mt-12">
    <div class="max-w-7xl mx-auto text-center">
      <h3 class="text-xl text-[#C8960C] uppercase tracking-widest mb-4">Ondjila Gold</h3>
      <p class="text-sm opacity-70">© 2026 Todos os direitos reservados.</p>

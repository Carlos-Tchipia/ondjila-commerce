<div class="bg-background text-on-background font-body-main selection:bg-primary-container selection:text-white min-h-screen flex flex-col">

    <header class="bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline shadow-sm docked full-width top-0 sticky h-[68px] z-50">
    <div class="flex justify-between items-center w-full px-gutter max-w-container_max mx-auto h-full">
    <div class="flex items-center gap-lg">
    <span class="font-hero-title text-section-title font-black text-primary-container dark:text-primary-fixed uppercase tracking-[0.2em] cursor-pointer" routerLink="/">ONDJILA</span>
    </div>
    </div>
    </header>
    
    <main class="flex-grow flex items-center justify-center w-full px-gutter py-xl">
    <div class="bg-white w-full max-w-[480px] rounded-card shadow-gold overflow-hidden border border-outline-variant/30">
    
    <!-- Form Content -->
    <div class="p-xl space-y-md">
    <div class="text-center space-y-xs mb-md">
    <h1 class="font-section-title text-[24px] text-on-background uppercase tracking-widest">Nova Senha</h1>
    <p class="font-body-main text-sm text-on-surface-variant">Crie uma nova palavra-passe para a sua conta.</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" #resetForm="ngForm" class="space-y-md">
    <div *ngIf="errorMessage" role="alert" class="bg-error/10 text-error text-[10px] p-md rounded-lg border border-error/20 font-bold uppercase tracking-wider text-center">
        {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" role="alert" class="bg-green-100 text-green-700 text-[10px] p-md rounded-lg border border-green-300 font-bold uppercase tracking-wider text-center">
        {{ successMessage }}
    </div>
    
    <div class="space-y-base" *ngIf="!successMessage">
    <label class="font-label-caps text-[10px] text-on-surface-variant block uppercase tracking-widest">Nova Palavra-passe</label>
    <input name="password" [(ngModel)]="password" class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant/50 rounded-lg focus:outline-none focus:border-primary-container transition-all text-sm" placeholder="Mínimo 6 caracteres" type="password"/>
    </div>
    
    <div class="pt-md">
    <button *ngIf="!successMessage" [disabled]="isLoading" class="w-full h-[56px] bg-primary-container text-white font-label-caps text-label-caps uppercase tracking-widest hover:bg-[#A87A09] transition-all gold-shadow disabled:opacity-50 flex justify-center items-center gap-sm" type="submit">
        <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        {{ isLoading ? 'A GUARDAR...' : 'GUARDAR NOVA SENHA' }}
    </button>
    <button *ngIf="successMessage" routerLink="/login" class="w-full h-[56px] bg-primary-container text-white font-label-caps text-label-caps uppercase tracking-widest hover:bg-[#A87A09] transition-all gold-shadow flex justify-center items-center gap-sm" type="button">
        IR PARA LOGIN
    </button>
    </div>
    </form>
    
    </div>
    </div>
    </main>
    
    <footer class="bg-on-background text-white mt-auto py-xl">
    <div class="max-w-container_max mx-auto px-gutter text-center">
    <h4 class="font-hero-title text-[20px] text-primary-container uppercase font-black mb-md">ONDJILA</h4>
    <p class="text-surface-variant text-[11px] uppercase tracking-widest">© 2026 ONDJILA COMMERCE. TODOS OS DIREITOS RESERVADOS.</p>
    </div>
    </footer>
    
    </div>
